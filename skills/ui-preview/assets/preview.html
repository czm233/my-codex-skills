<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>界面预演 · 选择与批注</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24312d;background:#f3f5f3}button,select,textarea{font:inherit}button,select{border:1px solid #d8ded9;background:white;border-radius:7px;padding:9px 13px;color:inherit;cursor:pointer}button:hover{background:#eef3ef}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #79b9a0}button:disabled{opacity:.45;cursor:default}.primary{background:#236b50;color:white;border-color:#236b50}.primary:hover{background:#18573e}header{min-height:76px;background:#fff;border-bottom:1px solid #dce2dd;display:flex;align-items:center;gap:10px;padding:16px 26px;flex-wrap:wrap}header strong{font-size:16px;margin-right:8px}.subtle{font-size:12px;color:#77847c}.divider{height:25px;width:1px;background:#dce2dd;margin:0 8px}.spacer{flex:1}.workspace{display:grid;grid-template-columns:minmax(0,1fr);min-height:calc(100vh - 76px)}.workspace.has-selection{grid-template-columns:minmax(0,1fr) 340px}main{padding:48px 42px}.canvas{max-width:950px;margin:auto;background:white;border:1px solid #dce2dd;border-radius:12px;box-shadow:0 8px 30px #253a2a06;padding:32px}.breadcrumb{font-size:12px;color:#7c8781;margin-bottom:28px}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;font-weight:600;margin:0}p{line-height:1.7}.meta{color:#7c8781;margin:10px 0 28px}.status{display:inline-block;border-radius:5px;background:#e8f4eb;color:#287048;padding:5px 9px;font-size:12px}.stats{display:flex;gap:65px;padding:26px 0;border-top:1px solid #edf0ed;border-bottom:1px solid #edf0ed;margin-bottom:26px}.stat small{display:block;color:#7c8781;margin-bottom:10px}.stat b{font-size:27px;font-weight:550;font-variant-numeric:tabular-nums}.notice{background:#f5f7f5;padding:14px;border-radius:6px;margin:20px 0;color:#67746b}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:#7c8781;font-weight:500;background:#f9faf9}td,th{padding:15px 12px;border-bottom:1px solid #edf0ed}aside{border-left:1px solid #dce2dd;background:#fff;padding:27px 22px}aside h2{font-size:16px;margin:0 0 24px}.empty{color:#88938d;font-size:13px;line-height:1.9;padding:35px 4px}.selection{background:#f4f8f5;border:1px solid #dae6dd;padding:14px;border-radius:8px;margin-bottom:22px}.selection h3{font-size:13px;margin:0 0 12px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{font-size:11px;padding:5px 7px;border-radius:4px;background:white;border:1px solid #dae2dc}textarea{width:100%;resize:vertical;min-height:100px;border:1px solid #ccd8cf;border-radius:6px;padding:10px;line-height:1.6;background:white;margin-bottom:10px}.actions{display:flex;justify-content:space-between;gap:8px}.comment{border-bottom:1px solid #e8ece8;padding:16px 0}.comment-top{display:flex;justify-content:space-between;align-items:center}.number{background:#236b50;color:white;border-radius:50%;width:23px;height:23px;display:inline-grid;place-items:center;font-size:12px}.comment p{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.comment .targets{font-size:12px;color:#7c8781}.text-button{background:none;border:0;padding:5px;font-size:12px;color:#7c8781}.pick-mode [data-label]{cursor:crosshair!important}.pick-mode [data-label]:hover{outline:2px dashed #68a488;outline-offset:3px}.selected{outline:2px solid #287956!important;outline-offset:3px;background-color:#e8f4ed!important}.annotated{box-shadow:0 0 0 2px #afcbbb}.focused{outline:3px solid #d59b33!important;outline-offset:4px}#modehint{padding:10px 26px;background:#e9f3ed;color:#286247;font-size:12px;border-bottom:1px solid #d5e5da}#feedback{font-size:12px;color:#7c8781;min-height:18px;margin-top:12px}[hidden]{display:none!important}@media(max-width:850px){.workspace,.workspace.has-selection{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #dce2dd}main{padding:24px 16px}.canvas{padding:22px}.stats{gap:30px}header{padding:14px 16px}.tablewrap{overflow:auto}.heading{align-items:flex-start}}

#modehint{display:none!important}.pick-mode #product,.pick-mode #product *{cursor:var(--pick-cursor),crosshair!important}.pick-mode [data-label]:hover{outline:none}.pick-mode #product .hover-target{outline:2px solid #2995ff!important;outline-offset:2px}.selected{outline:2px solid #2995ff!important;outline-offset:2px;background-color:#eaf4ff!important;position:relative}.selected:after{content:attr(data-number);position:absolute;right:-10px;top:-12px;min-width:22px;height:22px;padding:0 4px;border-radius:14px;background:#2995ff;color:white;font:12px/22px -apple-system,sans-serif;text-align:center;pointer-events:none;z-index:3}.note-row{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #e4eaf0}.note-index{flex:none;border-radius:50%;background:#2995ff;color:white;border:0;width:26px;height:26px;padding:0}.note-input{min-height:60px;margin:0;background:white;font-size:13px}.note-remove{border:0;background:none;padding:4px;color:#87929e}.selection{background:transparent;border:0;padding:0}.selection h3{display:none}.chips{display:block}.group-label{display:block;font-size:12px;color:#7c8781;margin:20px 0 10px}#bubble{position:fixed;z-index:20;display:flex;align-items:center;gap:8px;background:#303234;border:1px solid #45484c;border-radius:24px;padding:7px 9px 7px 13px;box-shadow:0 8px 24px #1d2d4226;width:330px;max-width:calc(100vw - 24px);color:white}#bubble:before{content:'';position:absolute;left:20px;top:-6px;width:10px;height:10px;background:#303234;transform:rotate(45deg)}#bubble-number{font-size:12px;color:#89c7ff;flex:none}#bubble-input{font:13px -apple-system,sans-serif;background:none;border:0;outline:0;color:white;resize:none;min-height:22px;height:24px;padding:3px;margin:0;flex:1;min-width:0}#bubble-input::placeholder{color:#aeb5bc}#bubble-done{background:#4b5055;color:#dce6ef;border:0;border-radius:50%;width:27px;height:27px;padding:0}
:root{--pick-cursor:image-set(url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2217%22%20viewBox%3D%220%200%2026%2028%22%3E%3Cpath%20d%3D%22M1%2026V15C1%208%206%203%2013%203s12%205%2012%2012-5%2012-12%2012H1Z%22%20fill%3D%22%232995ff%22%2F%3E%3C%2Fsvg%3E") 1x, url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2234%22%20viewBox%3D%220%200%2026%2028%22%3E%3Cpath%20d%3D%22M1%2026V15C1%208%206%203%2013%203s12%205%2012%2012-5%2012-12%2012H1Z%22%20fill%3D%22%232995ff%22%2F%3E%3C%2Fsvg%3E") 2x, url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2248%22%20height%3D%2251%22%20viewBox%3D%220%200%2026%2028%22%3E%3Cpath%20d%3D%22M1%2026V15C1%208%206%203%2013%203s12%205%2012%2012-5%2012-12%2012H1Z%22%20fill%3D%22%232995ff%22%2F%3E%3C%2Fsvg%3E") 3x) 1 15}#pick{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px 0 12px;border:1px solid transparent;border-radius:999px;background:#323232;color:#f3f4f5;line-height:1;font-size:13px;font-weight:400;white-space:nowrap;cursor:pointer}#pick svg{display:block;width:16px;height:16px;flex:none}#pick:hover{background:#323232}#pick.active{background:#313A48;border-color:#313A48;color:#80bfff;box-shadow:none;outline:none}#pick.active:hover{background:#313A48;border-color:#313A48;box-shadow:none}#pick:focus-visible{outline:2px solid #80bfff;outline-offset:3px}#pick{appearance:none;-webkit-appearance:none;background-clip:border-box}#pick.active:focus-visible{outline:2px solid #80bfff;outline-offset:2px}#product .stat small,#product .stat b{width:fit-content}#product .stat b{display:block}#product .pick-text{display:inline-block;max-width:100%;vertical-align:baseline}#product .stat small,#product .stat b{width:fit-content}.pick-mode #product,.pick-mode #product *{cursor:none!important}#sharp-cursor{position:fixed;left:0;top:0;width:25px;height:25px;pointer-events:none;z-index:99999;display:none;transform:none}#sharp-cursor svg{display:block;width:100%;height:100%}</style><header><strong>界面预演</strong><span class="subtle">模拟工具 · 非产品界面</span><div class="divider"></div><!-- CONTROLS_START --><button id="play">▷ 自动模拟</button><button id="step">单步</button><button id="reset">重置</button><select id="outcome" aria-label="模拟结果"><option value="success">模拟成功</option><option value="fail">模拟失败</option></select><!-- CONTROLS_END --><span class="spacer"></span><button id="pick" aria-pressed="false" aria-label="选择批注" title="选择批注"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4H5a1 1 0 0 0-1 1v3m12-4h3a1 1 0 0 1 1 1v3M4 16v3a1 1 0 0 0 1 1h3" stroke-dasharray="3 2"/><path d="m11 10 9 4-4 2-2 4-3-10Z"/></svg><span>Annotate</span></button></header><div class="workspace"><main><section class="canvas" id="product"><!-- PRODUCT_START --><div class="breadcrumb" data-label="面包屑">任务中心 / 任务详情</div><div class="heading"><h1 data-label="任务名称">每日数据同步</h1><button data-label="暂停按钮" id="pause">暂停任务</button></div><p class="meta" data-label="任务说明">每天同步测试数据至演示报表</p><span class="status" data-label="运行状态" id="status">运行中</span><div class="stats"><div class="stat" data-label="成功次数"><small>成功次数</small><b id="success">12</b></div><div class="stat" data-label="失败次数"><small>失败次数</small><b id="fail">0</b></div><div class="stat" data-label="下次执行"><small>下次执行</small><b id="next" style="font-size:18px">等待模拟</b></div></div><div class="notice" data-label="运行提示" id="notice">暂无异常</div><div class="tablewrap"><table><thead><tr><th data-label="执行时间表头">执行时间</th><th data-label="执行结果表头">结果</th><th data-label="处理条数表头">处理条数</th></tr></thead><tbody id="logs"><tr><td data-label="最近执行时间">第 12 次执行</td><td data-label="最近执行结果">成功</td><td data-label="最近处理条数">128 条</td></tr></tbody></table></div><!-- PRODUCT_END --></section></main><aside id="notes" hidden><h2>选择备注</h2><section class="selection" id="editor"><h3 id="selectedCount"></h3><div class="chips" id="chips"></div><label class="group-label" for="text">统一调整方式</label><textarea id="text" aria-label="调整方式" placeholder="这些位置需要怎样调整？"></textarea><div class="actions"><button id="clear">取消选择</button><button class="primary" id="save">复制</button></div></section><div id="feedback" role="status"></div></aside></div><div id="bubble" hidden><span id="bubble-number"></span><textarea id="bubble-input" aria-label="元素备注" placeholder="想把这里改成什么样？" rows="1"></textarea><button id="bubble-done" aria-label="完成备注" title="完成">✓</button></div><div id="sharp-cursor" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="17" viewBox="0 0 16 17"><path d="M1 16V9a7 7 0 1 1 7 7H1Z" fill="#2995ff"/></svg></div><script>
const $=id=>document.getElementById(id),product=$('product');let picking=false,selected=new Set(),notes=new Map(),numbers=new Map(),nextNumber=0,activeId=null;
// DEMO_STATE_START
let timer=null,round=12,ok=12,fail=0,paused=false;
// DEMO_STATE_END
// Split labelled containers into their text-bearing parts for precise picking.
product.querySelectorAll('[data-label]').forEach(el=>{if(el.children.length&&!el.matches('button')){const label=el.dataset.label;el.querySelectorAll('small,b').forEach(child=>{child.dataset.label=child.tagName==='SMALL'?child.textContent.trim():label+'数值'});if(el.querySelector('[data-label]'))el.removeAttribute('data-label')}});
// Keep layout containers intact; make their visible text the annotation target.
product.querySelectorAll('[data-label]').forEach(el=>{
  if(!el.matches('button')&&el.childElementCount===0&&el.textContent.trim()){
    const text=document.createElement('span');
    text.dataset.label=el.dataset.label;
    text.className='pick-text';
    text.textContent=el.textContent;
    el.replaceChildren(text);
    el.removeAttribute('data-label');
  }
});
product.querySelectorAll('[data-label]').forEach((el,i)=>el.dataset.target='target-'+i);
function refresh(){product.querySelectorAll('[data-target]').forEach(el=>{el.classList.toggle('selected',selected.has(el.dataset.target));el.dataset.number=numbers.get(el.dataset.target)||''});$('notes').hidden=!selected.size;document.querySelector('.workspace').classList.toggle('has-selection',!!selected.size);$('chips').replaceChildren();selected.forEach(id=>{const row=document.createElement('div');row.className='note-row';const number=document.createElement('button');number.className='note-index';number.textContent=numbers.get(id);number.setAttribute('aria-label','定位元素 '+numbers.get(id));number.onclick=()=>{const el=target(id);el.scrollIntoView({block:'center',behavior:'smooth'});openBubble(id)};const input=document.createElement('textarea');input.className='note-input';input.placeholder='调整方式（可稍后统一填写）';input.setAttribute('aria-label','元素 '+numbers.get(id)+' 的调整方式');input.value=notes.get(id)||'';input.oninput=()=>{notes.set(id,input.value);if(activeId===id)$('bubble-input').value=input.value;updateCopy()};const remove=document.createElement('button');remove.className='note-remove';remove.textContent='×';remove.setAttribute('aria-label','移除元素 '+numbers.get(id));remove.onclick=()=>{selected.delete(id);notes.delete(id);if(activeId===id)closeBubble();refresh()};row.append(number,input,remove);$('chips').append(row)});updateCopy();$('feedback').textContent=''}
const sharpCursor=$('sharp-cursor');
product.addEventListener('pointermove',e=>{sharpCursor.style.display=picking?'block':'none';const scale=window.devicePixelRatio||1;sharpCursor.style.left=(Math.round((e.clientX-1)*scale)/scale)+'px';sharpCursor.style.top=(Math.round((e.clientY-23)*scale)/scale)+'px'});
product.addEventListener('pointerleave',()=>{sharpCursor.style.display='none'});
window.addEventListener('blur',()=>{sharpCursor.style.display='none'});
function target(id){return product.querySelector('[data-target="'+id+'"]')}
function updateCopy(){$('save').disabled=!selected.size||!($('text').value.trim()||[...selected].some(id=>(notes.get(id)||'').trim()));$('save').textContent='复制'}
function closeBubble(){$('bubble').hidden=true;activeId=null}
function positionBubble(){if(!activeId||$('bubble').hidden)return;const r=target(activeId).getBoundingClientRect(),b=$('bubble');b.style.left=Math.max(12,Math.min(r.left,innerWidth-b.offsetWidth-12))+'px';b.style.top=Math.max(8,Math.min(r.bottom+14,innerHeight-b.offsetHeight-12))+'px'}
function openBubble(id){activeId=id;$('bubble-number').textContent=numbers.get(id);$('bubble-input').value=notes.get(id)||'';$('bubble').hidden=false;requestAnimationFrame(()=>{positionBubble();const input=$('bubble-input');input.focus({preventScroll:true});input.setSelectionRange(input.value.length,input.value.length)})}
$('bubble-input').oninput=()=>{if(!activeId)return;notes.set(activeId,$('bubble-input').value);const ids=[...selected],i=ids.indexOf(activeId);$('chips').children[i]?.querySelector('textarea')&&( $('chips').children[i].querySelector('textarea').value=$('bubble-input').value);updateCopy()};$('bubble-done').onclick=closeBubble;$('bubble-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();$('bubble-done').click()}});
window.addEventListener('resize',positionBubble);window.addEventListener('scroll',positionBubble,true);
product.addEventListener('pointermove',e=>{product.querySelector('.hover-target')?.classList.remove('hover-target');if(picking)e.target.closest('[data-target]')?.classList.add('hover-target')});product.addEventListener('pointerleave',()=>product.querySelector('.hover-target')?.classList.remove('hover-target'));
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#bubble')&&!e.target.closest('#product'))closeBubble()});
function mode(value){picking=value;if(!value)sharpCursor.style.display='none';if(!value){closeBubble();product.querySelector('.hover-target')?.classList.remove('hover-target')}document.body.classList.toggle('pick-mode',value);['pick'].forEach(id=>{$(id).classList.toggle('active',value);$(id).setAttribute('aria-pressed',value)});$('pick').setAttribute('aria-label',value?'退出选择':'选择批注');$('pick').title=value?'退出选择':'选择批注'}
$('pick').onclick=()=>mode(!picking);window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();if(document.activeElement?.closest('#bubble, #notes'))document.activeElement.blur();mode(false);selected.clear();notes.clear();numbers.clear();nextNumber=0;$('text').value='';$('copyFallback')?.remove();refresh()}},true);
product.addEventListener('click',e=>{if(!picking)return; e.preventDefault();e.stopImmediatePropagation();const el=e.target.closest('[data-target]');if(!el)return;const id=el.dataset.target;if(!selected.has(id)){selected.add(id);numbers.set(id,++nextNumber)}refresh();openBubble(id)},true);
$('text').oninput=updateCopy;$('clear').onclick=()=>{selected.clear();notes.clear();numbers.clear();nextNumber=0;closeBubble();$('text').value='';refresh()};
$('save').onclick=async()=>{if(!selected.size)return;const elements=[...selected].map(id=>{const el=target(id);return numbers.get(id)+'. '+el.dataset.label+'（'+(el.innerText??el.textContent??'').trim().replace(/\s+/g,' ')+'） [data-target="'+id+'"]'+((notes.get(id)||'').trim()?'\n调整方式：'+notes.get(id).trim():'')});const content='页面：'+document.title+'\n\n选中元素：\n'+elements.join('\n\n')+($('text').value.trim()?'\n\n统一调整方式：\n'+$('text').value.trim():'');let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(content);copied=true}}catch(e){}if(!copied){const helper=document.createElement('textarea');helper.value=content;helper.setAttribute('readonly','');helper.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(helper);helper.select();try{copied=document.execCommand('copy')}catch(e){}helper.remove()}if(copied){$('save').textContent='已复制';$('feedback').textContent=''}else{$('feedback').textContent='自动复制不可用，请在下方全选后复制。';let fallback=$('copyFallback');if(!fallback){fallback=document.createElement('textarea');fallback.id='copyFallback';fallback.setAttribute('aria-label','待复制内容');$('notes').append(fallback)}fallback.value=content;fallback.focus();fallback.select()}};
// SIMULATION_START
function valueNode(id){return $(id).querySelector('.pick-text')||$(id)}
function stop(){clearInterval(timer);timer=null;$('play').textContent='▷ 自动模拟'}
function step(){if(paused)return;round++;const failed=$('outcome').value==='fail';failed?fail++:ok++;valueNode('success').textContent=ok;valueNode('fail').textContent=fail;valueNode('notice').textContent=failed?'本次同步失败，可切换模拟结果后重试。':'最近一次同步成功';valueNode('next').textContent='等待模拟';const cells=$('logs').rows[0].cells;(cells[0].querySelector('.pick-text')||cells[0]).textContent='第 '+round+' 次执行';(cells[1].querySelector('.pick-text')||cells[1]).textContent=failed?'失败':'成功';(cells[2].querySelector('.pick-text')||cells[2]).textContent=failed?'0 条':'128 条'}
$('step').onclick=step;$('play').onclick=()=>{if(timer)stop();else{timer=setInterval(step,1200);$('play').textContent='Ⅱ 暂停模拟'}};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'恢复任务':'暂停任务';valueNode('status').textContent=paused?'已暂停':'运行中';$('step').disabled=paused;if(paused)stop();$('play').disabled=paused};
$('reset').onclick=()=>{stop();round=12;ok=12;fail=0;paused=false;valueNode('success').textContent=12;valueNode('fail').textContent=0;$('pause').textContent='暂停任务';valueNode('status').textContent='运行中';valueNode('notice').textContent='暂无异常';$('step').disabled=$('play').disabled=false;const cells=$('logs').rows[0].cells;(cells[0].querySelector('.pick-text')||cells[0]).textContent='第 12 次执行';(cells[1].querySelector('.pick-text')||cells[1]).textContent='成功';(cells[2].querySelector('.pick-text')||cells[2]).textContent='128 条';$('outcome').value='success'};
// SIMULATION_END
refresh();
</script></html>
